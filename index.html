<style>
/* ====================== VARIABLES ====================== */
:root {
  --negro:    #101f18;
  --verde:    #00d084;
  --verde2:   #00f5a0;
  --oro:      #ffc107;
  --rojo:     #ff4757;
  --gris1:    #1f2e22;
  --gris2:    #172318;
  --gris3:    #2c3e2f;
  --gris4:    #6a8a70;
  --blanco:   #e8f5e9;
  --fuente:   'Barlow', sans-serif;
  --titulo:   'Bebas Neue', cursive;
  --cond:     'Barlow Condensed', sans-serif;
  --ease-out:    cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--negro);
  color: var(--blanco);
  font-family: var(--fuente);
  min-height: 100vh;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 900px 600px at 10% 0%, rgba(0,208,132,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 700px 500px at 90% 100%, rgba(0,208,132,0.14) 0%, transparent 70%);
  pointer-events: none;
  z-index: 0;
}

header {
  background: linear-gradient(180deg, rgba(6,9,10,0.98) 0%, rgba(14,20,18,0.95) 100%);
  border-bottom: 1px solid rgba(0,208,132,0.25);
  box-shadow: 0 1px 0 rgba(0,208,132,0.08), 0 8px 32px rgba(0,0,0,0.5);
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
}
header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--verde) 40%, var(--verde2) 60%, transparent 100%);
  opacity: 0.7;
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  gap: 16px;
}

.logo h1 {
  font-family: var(--titulo);
  font-size: 2.4rem;
  letter-spacing: 3px;
  line-height: 1;
  color: var(--blanco);
}
.logo h1 span {
  color: var(--verde);
  text-shadow: 0 0 24px rgba(0,208,132,0.7), 0 0 48px rgba(0,208,132,0.3);
}
.logo p {
  font-family: var(--cond);
  font-size: 0.72rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gris4);
  margin-top: 1px;
}

.user-info { display: flex; align-items: center; gap: 12px; }

.user-chip {
  background: linear-gradient(135deg, rgba(0,208,132,0.15) 0%, rgba(0,208,132,0.08) 100%);
  border: 1px solid rgba(0,208,132,0.35);
  border-radius: 24px;
  padding: 7px 18px;
  font-family: var(--cond);
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--verde2);
  letter-spacing: 0.5px;
}

.btn-logout {
  background: transparent;
  border: 1px solid rgba(255,71,87,0.3);
  color: rgba(255,71,87,0.6);
  padding: 7px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-family: var(--cond);
  font-size: 0.85rem;
  letter-spacing: 0.5px;
  transition: border-color 160ms var(--ease-out), color 160ms var(--ease-out), background 160ms var(--ease-out), transform 120ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  .btn-logout:hover { border-color: var(--rojo); color: var(--rojo); background: rgba(255,71,87,0.08); }
}
.btn-logout:active { transform: scale(0.96); }

nav.tabs {
  background: rgba(14,20,18,0.95);
  border-bottom: 1px solid rgba(255,255,255,0.06);
  position: relative;
  z-index: 99;
  backdrop-filter: blur(12px);
}
nav.tabs ul {
  max-width: 1200px;
  margin: 0 auto;
  list-style: none;
  display: flex;
  padding: 0 28px;
}
nav.tabs li a {
  display: block;
  padding: 15px 24px;
  font-family: var(--cond);
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--gris4);
  border-bottom: 2px solid transparent;
  transition: color 160ms var(--ease-out), border-color 160ms var(--ease-out);
}
@media (hover: hover) and (pointer: fine) {
  nav.tabs li a:hover { color: rgba(232,245,233,0.75); }
}
nav.tabs li a.active {
  color: var(--verde);
  border-bottom-color: var(--verde);
  text-shadow: 0 0 16px rgba(0,208,132,0.5);
}

main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 36px 28px;
  position: relative;
  z-index: 1;
}
.section { display: none; }
.section.active { display: block; }

#login-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  position: fixed;
  inset: 0;
  z-index: 200;
  overflow: hidden;
  background: #101f18;
}

.login-orb { position: absolute; border-radius: 50%; filter: blur(80px); pointer-events: none; }
.login-orb-1 {
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(0,208,132,0.38) 0%, transparent 70%);
  top: -150px; left: -150px;
  animation: orbFloat 12s ease-in-out infinite alternate;
}
.login-orb-2 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(0,245,160,0.28) 0%, transparent 70%);
  bottom: -100px; right: -100px;
  animation: orbFloat 10s ease-in-out infinite alternate-reverse;
}
.login-orb-3 {
  width: 300px; height: 300px;
  background: radial-gradient(circle, rgba(255,193,7,0.12) 0%, transparent 70%);
  top: 50%; left: 50%;
  animation: orbFloat3 8s ease-in-out infinite alternate;
}

@keyframes orbFloat {
  0%   { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, -30px) scale(1.1); }
}
@keyframes orbFloat3 {
  0%   { transform: translate(-50%, -50%) scale(1); }
  100% { transform: translate(calc(-50% + 20px), calc(-50% - 20px)) scale(1.15); }
}

#login-screen::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,208,132,0.06) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,208,132,0.06) 1px, transparent 1px);
  background-size: 50px 50px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0,0,0,0.6) 20%, transparent 75%);
  -webkit-mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, rgba(0,0,0,0.6) 20%, transparent 75%);
}

.login-icon {
  font-size: 3.5rem;
  position: relative;
  z-index: 1;
  animation: ballBounce 2s var(--ease-out) both;
  filter: drop-shadow(0 0 20px rgba(0,208,132,0.4));
}
@keyframes ballBounce {
  0%   { opacity: 0; transform: translateY(-30px) scale(0.7); }
  60%  { transform: translateY(4px) scale(1.05); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.login-card {
  background: rgba(14,20,18,0.8);
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
  border: 1px solid rgba(0,208,132,0.25);
  border-radius: 24px;
  padding: 48px 44px 40px;
  width: 100%;
  max-width: 420px;
  text-align: center;
  position: relative;
  z-index: 1;
  box-shadow: 0 0 0 1px rgba(0,208,132,0.06) inset, 0 40px 80px rgba(0,0,0,0.7), 0 0 120px rgba(0,208,132,0.1);
  animation: cardEnter 600ms var(--ease-out) 200ms both;
}
.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 10%; right: 10%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--verde), var(--verde2), transparent);
  border-radius: 1px;
}
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(20px) scale(0.96); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.login-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,208,132,0.1);
  border: 1px solid rgba(0,208,132,0.25);
  border-radius: 20px;
  padding: 5px 14px;
  font-family: var(--cond);
  font-size: 0.72rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--verde);
  margin-bottom: 18px;
}

.login-card h2 {
  font-family: var(--titulo);
  font-size: 5rem;
  letter-spacing: 5px;
  color: var(--blanco);
  line-height: 0.95;
  margin-bottom: 6px;
}
.login-card h2 span {
  color: var(--verde);
  text-shadow: 0 0 40px rgba(0,208,132,0.8), 0 0 80px rgba(0,208,132,0.3);
}
.login-card > p {
  color: var(--gris4);
  font-size: 0.78rem;
  margin: 0 0 36px;
  font-family: var(--cond);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.login-card input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 14px 18px;
  color: var(--blanco);
  font-family: var(--fuente);
  font-size: 1rem;
  margin-bottom: 10px;
  outline: none;
  transition: border-color 180ms var(--ease-out), box-shadow 180ms var(--ease-out), background 180ms var(--ease-out);
}
.login-card input:focus {
  border-color: var(--verde);
  background: rgba(0,208,132,0.06);
  box-shadow: 0 0 0 3px rgba(0,208,132,0.15);
}
.login-card input::placeholder { color: var(--gris4); }

.btn-login {
  width: 100%;
  background: linear-gradient(135deg, var(--verde) 0%, var(--verde2) 100%);
  color: #1a0000;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-family: var(--titulo);
  font-size: 1.4rem;
  letter-spacing: 2px;
  cursor: pointer;
  transition: opacity 180ms var(--ease-out), transform 120ms var(--ease-out), box-shadow 180ms var(--ease-out);
  margin-top: 10px;
  box-shadow: 0 4px 24px rgba(0,208,132,0.35), 0 1px 0 rgba(255,255,255,0.15) inset;
}
@media (hover: hover) and (pointer: fine) {
  .btn-login:hover { opacity: 0.9; box-shadow: 0 8px 32px rgba(0,208,132,0.5); }
}
.btn-login:active { transform: scale(0.97); }

.login-error {
  color: var(--rojo);
  font-size: 0.85rem;
  margin-top: 14px;
  font-family: var(--cond);
  min-height: 20px;
  letter-spacing: 0.5px;
}

.grupo-section { margin-bottom: 48px; }
.grupo-header {
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.07);
}
.grupo-label {
  font-family: var(--titulo);
  font-size: 1rem;
  letter-spacing: 2px;
  color: #1a0000;
  background: var(--verde);
  padding: 4px 14px 2px;
  border-radius: 6px;
  box-shadow: 0 0 16px rgba(0,208,132,0.4);
}
.grupo-equipos { font-family: var(--cond); font-size: 0.95rem; color: var(--gris4); letter-spacing: 0.5px; }

.partidos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(430px, 1fr));
  gap: 8px;
}

.partido-card {
  background: linear-gradient(135deg, rgba(24,32,25,0.9) 0%, rgba(14,20,18,0.95) 100%);
  border: 1px solid rgba(255,255,255,0.07);
  border-left: 3px solid transparent;
  border-radius: 14px;
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: border-color 180ms var(--ease-out), background 180ms var(--ease-out), transform 150ms var(--ease-out), box-shadow 180ms var(--ease-out);
  opacity: 0;
  transform: translateY(8px);
  animation: cardIn 300ms var(--ease-out) forwards;
}
@keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
@media (hover: hover) and (pointer: fine) {
  .partido-card:hover {
    border-color: rgba(0,208,132,0.2);
    border-left-color: rgba(0,208,132,0.4);
    background: linear-gradient(135deg, rgba(0,208,132,0.06) 0%, rgba(14,20,18,0.95) 100%);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,208,132,0.1);
  }
}
.partido-card.completado {
  border-left-color: var(--verde);
  background: linear-gradient(135deg, rgba(0,208,132,0.08) 0%, rgba(14,20,18,0.95) 100%);
}
.partido-card.cerrado { opacity: 0.55; pointer-events: none; }

.equipo-nombre { font-family: var(--cond); font-weight: 700; font-size: 1.18rem; flex: 1; text-align: right; letter-spacing: 0.3px; }
.equipo-nombre.visitante { text-align: left; }
.marcador-input { display: flex; align-items: center; gap: 6px; }

.gol-input {
  width: 46px; height: 46px;
  background: rgba(0,0,0,0.4);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  color: var(--blanco);
  font-family: var(--titulo);
  font-size: 1.5rem;
  text-align: center;
  outline: none;
  transition: border-color 160ms var(--ease-out), box-shadow 160ms var(--ease-out), transform 120ms var(--ease-out);
  -moz-appearance: textfield;
}
.gol-input::-webkit-outer-spin-button,
.gol-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.gol-input:focus { border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0,208,132,0.2); transform: scale(1.06); }

.gol-sep { font-family: var(--titulo); font-size: 1.3rem; color: var(--gris4); user-select: none; }

.fecha-badge {
  font-family: var(--cond); font-size: 0.68rem; color: var(--gris4);
  background: rgba(255,255,255,0.05); padding: 3px 8px; border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.08); letter-spacing: 0.5px;
}

.punto-badge { font-family: var(--titulo); font-size: 0.9rem; width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.punto-5 { background: var(--oro); color: #1a1200; box-shadow: 0 0 14px rgba(255,193,7,0.5); }
.punto-3 { background: var(--verde); color: #1a0000; box-shadow: 0 0 14px rgba(0,208,132,0.45); }
.punto-0 { background: rgba(255,255,255,0.06); color: var(--gris4); }
.punto-pendiente { border: 1px dashed rgba(255,255,255,0.12); }

.btn-guardar {
  background: linear-gradient(135deg, var(--verde) 0%, var(--verde2) 100%);
  color: #1a0000; border: none; border-radius: 12px; padding: 13px 36px;
  font-family: var(--titulo); font-size: 1.15rem; letter-spacing: 2px; cursor: pointer;
  transition: opacity 160ms var(--ease-out), transform 120ms var(--ease-out), box-shadow 160ms var(--ease-out);
  display: block; margin: 36px auto 0; box-shadow: 0 4px 24px rgba(0,208,132,0.3);
}
@media (hover: hover) and (pointer: fine) {
  .btn-guardar:hover { opacity: 0.88; box-shadow: 0 8px 32px rgba(0,208,132,0.45); }
}
.btn-guardar:active { transform: scale(0.97); }
.btn-guardar:disabled { background: var(--gris3); color: var(--gris4); cursor: not-allowed; box-shadow: none; opacity: 1; }

.save-status { text-align: center; font-family: var(--cond); font-size: 0.85rem; color: var(--verde); margin-top: 10px; min-height: 20px; }

.banner-cerrado {
  background: rgba(255,193,7,0.07); border: 1px solid rgba(255,193,7,0.3);
  border-left: 4px solid var(--oro); border-radius: 14px; padding: 20px 24px;
  margin-bottom: 28px; display: flex; align-items: center; gap: 16px;
}
.banner-cerrado .icon { font-size: 2rem; }
.banner-cerrado p { font-family: var(--cond); }
.banner-cerrado strong { color: var(--oro); font-size: 1.1rem; display: block; }
.banner-cerrado span { color: var(--gris4); font-size: 0.85rem; }

.ranking-table { width: 100%; border-collapse: collapse; }
.ranking-table th { font-family: var(--cond); font-weight: 700; font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; color: var(--gris4); padding: 10px 16px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
.ranking-table td { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); font-family: var(--cond); font-size: 1.15rem; transition: background 140ms var(--ease-out); }
.ranking-table tbody tr { opacity: 0; animation: rankRowIn 320ms var(--ease-out) forwards; }
.ranking-table tbody tr:nth-child(1)  { animation-delay: 0ms; }
.ranking-table tbody tr:nth-child(2)  { animation-delay: 40ms; }
.ranking-table tbody tr:nth-child(3)  { animation-delay: 80ms; }
.ranking-table tbody tr:nth-child(4)  { animation-delay: 120ms; }
.ranking-table tbody tr:nth-child(5)  { animation-delay: 160ms; }
.ranking-table tbody tr:nth-child(6)  { animation-delay: 200ms; }
.ranking-table tbody tr:nth-child(7)  { animation-delay: 240ms; }
.ranking-table tbody tr:nth-child(8)  { animation-delay: 280ms; }
.ranking-table tbody tr:nth-child(n+9) { animation-delay: 300ms; }
@keyframes rankRowIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
@media (hover: hover) and (pointer: fine) { .ranking-table tr:hover td { background: rgba(0,208,132,0.05); } }

.rank-pos { font-family: var(--titulo); font-size: 1.5rem; color: var(--gris4); width: 50px; }
.rank-pos.top1 { color: var(--oro); text-shadow: 0 0 16px rgba(255,193,7,0.6); }
.rank-pos.top2 { color: #c8d6c8; }
.rank-pos.top3 { color: #cd8b3a; }
.rank-nombre { font-weight: 700; color: var(--blanco); font-size: 1.25rem; }
.rank-yo { color: var(--verde2); }
.rank-pts { font-family: var(--titulo); font-size: 1.7rem; color: var(--verde); text-align: right; text-shadow: 0 0 12px rgba(0,208,132,0.3); }
.rank-5s, .rank-3s { font-family: var(--titulo); font-size: 1.15rem; text-align: center; }
.rank-5s { color: var(--oro); }
.rank-3s { color: var(--verde); }

.resultados-grupo { margin-bottom: 36px; }
.resultado-row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 140ms var(--ease-out); border-radius: 8px; }
@media (hover: hover) and (pointer: fine) { .resultado-row:hover { background: rgba(0,208,132,0.04); } }
.res-local { text-align: right; flex: 1; font-family: var(--cond); font-weight: 700; font-size: 1.15rem; }
.res-marcadores { display: flex; align-items: center; gap: 8px; font-family: var(--titulo); font-size: 1.2rem; }
.res-real { color: var(--blanco); }
.res-pred { color: var(--gris4); font-size: 0.9rem; }
.res-sep { color: var(--gris4); }
.res-visitante { flex: 1; font-family: var(--cond); font-weight: 700; font-size: 1.15rem; }
.res-pts { width: 40px; text-align: center; }

.spinner { width: 36px; height: 36px; border: 2px solid rgba(255,255,255,0.08); border-top-color: var(--verde); border-radius: 50%; animation: spin .6s linear infinite; margin: 60px auto; box-shadow: 0 0 16px rgba(0,208,132,0.2); }
@keyframes spin { to { transform: rotate(360deg); } }

#toast {
  position: fixed; bottom: 28px; right: 28px;
  background: rgba(14,20,18,0.95); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(0,208,132,0.4); border-radius: 12px; padding: 13px 24px;

// ============================================================
// RENDER ELIMINATORIAS — DISEÑO RESPONSIVE
// ============================================================
function renderEliminatorias() {
  const cont = document.getElementById("eliminatorias-content");

  // Limpiar timers anteriores
  countdownTimers.forEach(t => clearInterval(t));
  countdownTimers = [];

  // Agrupar por fase — orden: 16avos primero, final último
  const FASES_ORDEN_DISP = ["16avos","octavos","cuartos","semis","tercero","final"];
  const FASES_LABELS_LOC = {
    "16avos":"16avos de Final","octavos":"Octavos de Final",
    "cuartos":"Cuartos de Final","semis":"Semifinales",
    "tercero":"3er Puesto","final":"Final"
  };

  const fases = {};
  FASES_ORDEN_DISP.forEach(f => { fases[f] = []; });
  window.FIXTURE_ELIM.forEach(p => { fases[p.fase].push(p); });

  // Ver si hay algún partido disponible
  const hayPartidos = window.FIXTURE_ELIM.some(p => p.local || p.visitante || elimPartidosCache[p.id]);
  if (!hayPartidos) {
    cont.innerHTML = `<div style="text-align:center;padding:60px 20px;font-family:var(--cond);color:var(--gris4);">
      <div style="font-size:3rem;margin-bottom:12px">⏳</div>
      <div style="font-family:var(--titulo);font-size:1.8rem;letter-spacing:2px;margin-bottom:8px">PRÓXIMAMENTE</div>
      <div>Los cruces se habilitarán cuando finalice la fase de grupos.</div>
    </div>`;
    return;
  }

  let html = `<div class="elim-header">
    <div class="elim-title">ELIMINATORIAS <span>2026</span></div>
    <div style="font-family:var(--cond);font-size:0.78rem;color:var(--gris4)">
      Resultado a los 90 min · 3pts resultado · 5pts exacto
    </div>
  </div>`;

  FASES_ORDEN_DISP.forEach(fase => {
    const partidos = fases[fase];
    const disponibles = partidos.filter(p => p.local || p.visitante || elimPartidosCache[p.id]);
    if (disponibles.length === 0) return;

    html += `<div class="elim-fase-section">
      <div class="elim-fase-header">
        <span class="elim-fase-label">${FASES_LABELS_LOC[fase]}</span>
      </div>
      <div class="elim-partidos-grid">`;

    partidos.forEach((p, pidx) => {
      let datos = elimPartidosCache[p.id] || {};
      const local = p.local || datos.local || null;
      const visitante = p.visitante || datos.visitante || null;
      if (!local && !visitante) return; // sin equipos = no mostrar

      const cerrado = datos.cerrado || false;
      const real = (datos.gl_real !== undefined && datos.gl_real !== null)
        ? { gl: datos.gl_real, gv: datos.gv_real } : null;
      const pred = elimPredsCache[p.id] || null;
      const pts = calcularPuntos(pred, real);

      const cardClass = cerrado ? "cerrado" : "abierto";
      const ro = cerrado ? "readonly" : "";
      const glVal = pred && pred.gl !== null ? pred.gl : "";
      const gvVal = pred && pred.gv !== null ? pred.gv : "";
      const delay = pidx * 40;

      // Badge puntos
      let ptsBadge = `<div class="elim-pts epts-null"></div>`;
      if (pts === 5) ptsBadge = `<div class="elim-pts epts-5">5</div>`;
      else if (pts === 3) ptsBadge = `<div class="elim-pts epts-3">3</div>`;
      else if (pts === 0 && real) ptsBadge = `<div class="elim-pts epts-0">0</div>`;

      // Resultado real
      const glReal = real ? `<span class="elim-real">${real.gl}</span>` : `<span class="elim-real pendiente">?</span>`;
      const gvReal = real ? `<span class="elim-real">${real.gv}</span>` : `<span class="elim-real pendiente">?</span>`;

      html += `<div class="elim-card ${cardClass}" style="animation-delay:${delay}ms">
        <div class="elim-card-header">
          <span class="elim-card-num">${FASES_LABELS_LOC[fase]} · P${p.num}</span>
          ${ptsBadge}
        </div>
        <div class="elim-equipo-row">
          <div class="elim-equipo-nombre ${!local?'tbd':''}">${local ? getBandera(local) + local : 'Por definir'}</div>
          <input type="number" class="elim-inp" min="0" max="20"
            data-pid="${p.id}" data-lado="gl" value="${glVal}" ${ro} placeholder="–">
          ${glReal}
        </div>
        <div class="elim-equipo-row">
          <div class="elim-equipo-nombre ${!visitante?'tbd':''}">${visitante ? getBandera(visitante) + visitante : 'Por definir'}</div>
          <input type="number" class="elim-inp" min="0" max="20"
            data-pid="${p.id}" data-lado="gv" value="${gvVal}" ${ro} placeholder="–">
          ${gvReal}
        </div>
        <div class="elim-countdown" id="cd-${p.id}">
          ${cerrado ? '<span class="countdown-cerrado">🔒 Cerrado</span>' : ''}
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  html += `<div class="elim-save-bar">
    <button class="btn-guardar" id="btn-guardar-elim">GUARDAR PREDICCIONES</button>
    <div class="save-status" id="elim-save-status"></div>
  </div>`;

  cont.innerHTML = html;

  // Listeners inputs
  cont.querySelectorAll(".elim-inp").forEach(inp => {
    inp.addEventListener("input", () => {
      const pid = inp.dataset.pid, lado = inp.dataset.lado;
      const val = inp.value === "" ? null : parseInt(inp.value);
      if (!elimPredsCache[pid]) elimPredsCache[pid] = { gl: null, gv: null };
      elimPredsCache[pid][lado] = val;
    });
  });

  document.getElementById("btn-guardar-elim").addEventListener("click", guardarElim);

  // Iniciar countdowns
  iniciarCountdowns();
}

// ============================================================
// COUNTDOWNS
// ============================================================
function iniciarCountdowns() {
  window.FIXTURE_ELIM.forEach(p => {
    const datos = elimPartidosCache[p.id] || {};
    if (datos.cerrado) return;
    const local = p.local || datos.local;
    const visitante = p.visitante || datos.visitante;
    if (!local && !visitante) return;
    const horaPartido = new Date(datos.fechaISO || p.fechaISO);
    const el = document.getElementById(`cd-${p.id}`);
    if (!el) return;
    const timer = setInterval(() => {
      const ahora = ahoraReal();
      const diff = horaPartido - ahora;
      if (diff <= 0) {
        clearInterval(timer);
        el.innerHTML = '<span class="countdown-cerrado">🔒 Cerrando...</span>';
        verificarCierresAutomaticos();
        return;
      }
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000) / 60000);
      const s = Math.floor((diff % 60000) / 1000);
      let txt = d > 0 ? `${d}d ${h}h ${m}m` : h > 0 ? `${h}h ${m}m ${s}s` : `${m}m ${s}s`;
      const urgente = diff < 3600000;
      el.innerHTML = `<span class="${urgente?'countdown-urgente':'countdown-abierto'}">⏱ ${txt}</span>`;
    }, 1000);
    countdownTimers.push(timer);
  });
}

// ============================================================
// GUARDAR PREDICCIONES ELIMINATORIAS
// ============================================================
async function guardarElim() {
  const btn = document.getElementById("btn-guardar-elim");
  const status = document.getElementById("elim-save-status");
  btn.disabled = true; btn.textContent = "GUARDANDO...";
  const { doc, setDoc } = window._firebase;
  try {
    await setDoc(doc(window._db, "predicciones_elim", currentUser.id), elimPredsCache);
    status.textContent = "✓ Predicciones guardadas";
    toast("✓ Guardado");
  } catch(e) {
    status.style.color = "var(--rojo)";
    status.textContent = "✗ Error al guardar.";
    console.error(e);
  } finally { btn.disabled = false; btn.textContent = "GUARDAR PREDICCIONES"; }
}
