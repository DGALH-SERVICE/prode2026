<style>
/* ====================== VARIABLES ====================== */
:root {
  --negro:    #080b08;
  --verde:    #00c853;
  --verde2:   #00e676;
  --verde-dim: rgba(0, 200, 83, 0.08);
  --oro:      #ffd600;
  --rojo:     #f44336;
  --gris1:    #111411;
  --gris2:    #1c201c;
  --gris3:    #2a2e2a;
  --gris4:    #5a625a;
  --blanco:   #eef2ee;
  --fuente:   'Barlow', sans-serif;
  --titulo:   'Bebas Neue', cursive;
  --cond:     'Barlow Condensed', sans-serif;

  /* Custom easing curves — Emil Kowalski */
  --ease-out:     cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out:  cubic-bezier(0.77, 0, 0.175, 1);
  --ease-spring:  cubic-bezier(0.34, 1.56, 0.64, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--negro);
  color: var(--blanco);
  font-family: var(--fuente);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== FONDO SUTIL ===== */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 50% at 20% -10%, rgba(0,200,83,0.055) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 110%, rgba(0,200,83,0.04) 0%, transparent 60%);
  pointer-events: none;
  z-index: 0;
}

/* ===== HEADER ===== */
header {
  background: rgba(8, 11, 8, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,200,83,0.2);
  padding: 0;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  gap: 16px;
}

.logo h1 {
  font-family: var(--titulo);
  font-size: 2.2rem;
  letter-spacing: 2px;
  line-height: 1;
  color: var(--blanco);
}
.logo h1 span {
  color: var(--verde);
  text-shadow: 0 0 20px rgba(0,200,83,0.4);
}
.logo p {
  font-family: var(--cond);
  font-size: 0.75rem;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--gris4);
}

.user-info {
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-chip {
  background: rgba(0,200,83,0.1);
  border: 1px solid rgba(0,200,83,0.3);
  border-radius: 24px;
  padding: 6px 16px;
  font-family: var(--cond);
  font-weight: 600;
  font-size: 0.9rem;
  color: var(--verde2);
  letter-spacing: 0.5px;
}
.btn-logout {
  background: transparent;
  border: 1px solid var(--gris3);
  color: var(--gris4);
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-family: var(--cond);
  font-size: 0.85rem;
  transition: border-color 180ms var(--ease-out), color 180ms var(--ease-out), transform 120ms var(--ease-out);
}
.btn-logout:hover { border-color: var(--rojo); color: var(--rojo); }
@media (hover: hover) and (pointer: fine) {
  .btn-logout:hover { border-color: var(--rojo); color: var(--rojo); }
}
.btn-logout:active { transform: scale(0.97); }

/* ===== NAV TABS ===== */
nav.tabs {
  background: rgba(17, 20, 17, 0.9);
  border-bottom: 1px solid var(--gris3);
  position: relative;
  z-index: 99;
}
nav.tabs ul {
  max-width: 1200px;
  margin: 0 auto;
  list-style: none;
  display: flex;
  gap: 0;
  padding: 0 24px;
}
nav.tabs li a {
  display: block;
  padding: 14px 22px;
  font-family: var(--cond);
  font-weight: 700;
  font-size: 0.9rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--gris4);
  border-bottom: 2px solid transparent;
  transition: color 180ms var(--ease-out), border-color 180ms var(--ease-out);
  position: relative;
}
nav.tabs li a:hover { color: var(--blanco); }
nav.tabs li a.active {
  color: var(--verde);
  border-bottom-color: var(--verde);
  text-shadow: 0 0 12px rgba(0,200,83,0.3);
}

/* ===== MAIN ===== */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 32px 24px;
  position: relative;
  z-index: 1;
}

.section { display: none; }
.section.active { display: block; }

/* ===== LOGIN ===== */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  position: fixed;
  inset: 0;
  z-index: 200;
  overflow: hidden;
}

/* Fondo animado del login */
#login-screen::before {
  content: '';
  position: absolute;
  inset: -50%;
  background:
    radial-gradient(ellipse 60% 60% at 30% 40%, rgba(0,200,83,0.12) 0%, transparent 55%),
    radial-gradient(ellipse 50% 50% at 70% 60%, rgba(0,230,118,0.07) 0%, transparent 55%),
    radial-gradient(ellipse 80% 80% at 50% 50%, #080b08 40%, #0d1a0d 100%);
  animation: loginBgPulse 8s ease-in-out infinite alternate;
}

@keyframes loginBgPulse {
  0%   { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.08) rotate(2deg); }
}

/* Líneas decorativas campo de fútbol */
#login-screen::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(0,200,83,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,200,83,0.04) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 80%);
  -webkit-mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 30%, transparent 80%);
}

.login-card {
  background: rgba(17, 20, 17, 0.75);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid rgba(0,200,83,0.2);
  border-radius: 20px;
  padding: 52px 44px;
  width: 100%;
  max-width: 400px;
  text-align: center;
  position: relative;
  z-index: 1;
  box-shadow:
    0 0 0 1px rgba(0,200,83,0.05) inset,
    0 32px 64px rgba(0,0,0,0.6),
    0 0 80px rgba(0,200,83,0.06);
  animation: cardEnter 500ms var(--ease-out) both;
}

@keyframes cardEnter {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Badge DGALH */
.login-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(0,200,83,0.08);
  border: 1px solid rgba(0,200,83,0.2);
  border-radius: 20px;
  padding: 4px 12px;
  font-family: var(--cond);
  font-size: 0.7rem;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--verde);
  margin-bottom: 20px;
}

.login-card h2 {
  font-family: var(--titulo);
  font-size: 4rem;
  letter-spacing: 4px;
  color: var(--blanco);
  line-height: 1;
}
.login-card h2 span {
  color: var(--verde);
  text-shadow: 0 0 30px rgba(0,200,83,0.5);
}
.login-card p {
  color: var(--gris4);
  font-size: 0.8rem;
  margin: 10px 0 36px;
  font-family: var(--cond);
  letter-spacing: 3px;
  text-transform: uppercase;
}
.login-card input {
  width: 100%;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--gris3);
  border-radius: 10px;
  padding: 14px 18px;
  color: var(--blanco);
  font-family: var(--fuente);
  font-size: 1rem;
  margin-bottom: 12px;
  outline: none;
  transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
}
.login-card input:focus {
  border-color: var(--verde);
  box-shadow: 0 0 0 3px rgba(0,200,83,0.12);
}
.login-card input::placeholder { color: var(--gris4); }
.btn-login {
  width: 100%;
  background: var(--verde);
  color: var(--negro);
  border: none;
  border-radius: 10px;
  padding: 15px;
  font-family: var(--titulo);
  font-size: 1.3rem;
  letter-spacing: 2px;
  cursor: pointer;
  transition: background 180ms var(--ease-out), transform 120ms var(--ease-out), box-shadow 180ms var(--ease-out);
  margin-top: 8px;
  box-shadow: 0 4px 20px rgba(0,200,83,0.25);
}
@media (hover: hover) and (pointer: fine) {
  .btn-login:hover {
    background: var(--verde2);
    box-shadow: 0 6px 28px rgba(0,200,83,0.4);
  }
}
.btn-login:active { transform: scale(0.97); }
.login-error {
  color: var(--rojo);
  font-size: 0.85rem;
  margin-top: 12px;
  font-family: var(--cond);
  min-height: 20px;
}

/* ===== GRILLA DE PREDICCIONES ===== */
.grupo-section {
  margin-bottom: 44px;
  animation: sectionEnter 400ms var(--ease-out) both;
}

@keyframes sectionEnter {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.grupo-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--gris3);
}
.grupo-label {
  font-family: var(--titulo);
  font-size: 2rem;
  color: var(--verde);
  letter-spacing: 2px;
  text-shadow: 0 0 16px rgba(0,200,83,0.25);
}
.grupo-equipos {
  font-family: var(--cond);
  font-size: 0.8rem;
  color: var(--gris4);
  letter-spacing: 1px;
}

.partidos-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
  gap: 8px;
}

/* Stagger en tarjetas */
.partido-card {
  background: var(--gris1);
  border: 1px solid var(--gris3);
  border-radius: 12px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: border-color 180ms var(--ease-out), background 180ms var(--ease-out), transform 150ms var(--ease-out), box-shadow 180ms var(--ease-out);
  opacity: 0;
  transform: translateY(6px);
  animation: cardFadeIn 280ms var(--ease-out) forwards;
}

@keyframes cardFadeIn {
  to { opacity: 1; transform: translateY(0); }
}

/* Stagger delay via nth-child */
.partido-card:nth-child(1)  { animation-delay: 0ms; }
.partido-card:nth-child(2)  { animation-delay: 40ms; }
.partido-card:nth-child(3)  { animation-delay: 80ms; }
.partido-card:nth-child(4)  { animation-delay: 120ms; }
.partido-card:nth-child(5)  { animation-delay: 160ms; }
.partido-card:nth-child(6)  { animation-delay: 200ms; }

@media (hover: hover) and (pointer: fine) {
  .partido-card:hover {
    border-color: var(--gris4);
    background: var(--gris2);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
}

.partido-card.completado {
  border-color: rgba(0,200,83,0.4);
  border-left: 3px solid var(--verde);
  background: rgba(0,200,83,0.04);
}
.partido-card.cerrado { opacity: 0.6; pointer-events: none; }

.equipo-nombre {
  font-family: var(--cond);
  font-weight: 700;
  font-size: 0.95rem;
  flex: 1;
  text-align: right;
}
.equipo-nombre.visitante { text-align: left; }

.marcador-input {
  display: flex;
  align-items: center;
  gap: 6px;
}
.gol-input {
  width: 44px;
  height: 44px;
  background: var(--gris2);
  border: 1px solid var(--gris3);
  border-radius: 8px;
  color: var(--blanco);
  font-family: var(--titulo);
  font-size: 1.4rem;
  text-align: center;
  outline: none;
  transition: border-color 180ms var(--ease-out), box-shadow 180ms var(--ease-out), transform 120ms var(--ease-out);
  -moz-appearance: textfield;
}
.gol-input::-webkit-outer-spin-button,
.gol-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.gol-input:focus {
  border-color: var(--verde);
  box-shadow: 0 0 0 3px rgba(0,200,83,0.12);
  transform: scale(1.05);
}
.gol-sep {
  font-family: var(--titulo);
  font-size: 1.2rem;
  color: var(--gris4);
}
.fecha-badge {
  font-family: var(--cond);
  font-size: 0.7rem;
  color: var(--gris4);
  background: var(--gris2);
  padding: 3px 8px;
  border-radius: 6px;
  border: 1px solid var(--gris3);
}

/* Indicadores de resultado */
.punto-badge {
  font-family: var(--titulo);
  font-size: 0.95rem;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.punto-5 {
  background: var(--oro);
  color: var(--negro);
  box-shadow: 0 0 12px rgba(255,214,0,0.4);
}
.punto-3 {
  background: var(--verde);
  color: var(--negro);
  box-shadow: 0 0 12px rgba(0,200,83,0.35);
}
.punto-0 { background: var(--gris3); color: var(--gris4); }
.punto-pendiente { border: 1px dashed var(--gris3); }

/* Botón guardar */
.btn-guardar {
  background: var(--verde);
  color: var(--negro);
  border: none;
  border-radius: 10px;
  padding: 13px 32px;
  font-family: var(--titulo);
  font-size: 1.15rem;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: background 180ms var(--ease-out), transform 120ms var(--ease-out), box-shadow 180ms var(--ease-out);
  display: block;
  margin: 36px auto 0;
  box-shadow: 0 4px 20px rgba(0,200,83,0.25);
}
@media (hover: hover) and (pointer: fine) {
  .btn-guardar:hover {
    background: var(--verde2);
    box-shadow: 0 6px 28px rgba(0,200,83,0.4);
  }
}
.btn-guardar:active { transform: scale(0.97); }
.btn-guardar:disabled {
  background: var(--gris3);
  color: var(--gris4);
  cursor: not-allowed;
  box-shadow: none;
}

.save-status {
  text-align: center;
  font-family: var(--cond);
  font-size: 0.85rem;
  color: var(--verde);
  margin-top: 10px;
  min-height: 20px;
}

/* ===== BANNER CERRADO ===== */
.banner-cerrado {
  background: rgba(255,214,0,0.05);
  border: 1px solid rgba(255,214,0,0.3);
  border-radius: 12px;
  padding: 20px 24px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 16px;
}
.banner-cerrado .icon { font-size: 2rem; }
.banner-cerrado p { font-family: var(--cond); }
.banner-cerrado strong { color: var(--oro); font-size: 1.1rem; display: block; }
.banner-cerrado span { color: var(--gris4); font-size: 0.85rem; }

/* ===== RANKING ===== */
.ranking-table {
  width: 100%;
  border-collapse: collapse;
}
.ranking-table th {
  font-family: var(--cond);
  font-weight: 700;
  font-size: 0.72rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--gris4);
  padding: 10px 16px;
  text-align: left;
  border-bottom: 1px solid var(--gris3);
}
.ranking-table td {
  padding: 13px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  font-family: var(--cond);
  font-size: 1rem;
  transition: background 150ms var(--ease-out);
}
.ranking-table tbody tr {
  opacity: 0;
  animation: rankRowIn 280ms var(--ease-out) forwards;
}
.ranking-table tbody tr:nth-child(1)  { animation-delay: 0ms; }
.ranking-table tbody tr:nth-child(2)  { animation-delay: 35ms; }
.ranking-table tbody tr:nth-child(3)  { animation-delay: 70ms; }
.ranking-table tbody tr:nth-child(4)  { animation-delay: 105ms; }
.ranking-table tbody tr:nth-child(5)  { animation-delay: 140ms; }
.ranking-table tbody tr:nth-child(6)  { animation-delay: 175ms; }
.ranking-table tbody tr:nth-child(7)  { animation-delay: 210ms; }
.ranking-table tbody tr:nth-child(8)  { animation-delay: 245ms; }
.ranking-table tbody tr:nth-child(n+9) { animation-delay: 280ms; }

@keyframes rankRowIn {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}

@media (hover: hover) and (pointer: fine) {
  .ranking-table tr:hover td { background: var(--gris2); }
}

.rank-pos {
  font-family: var(--titulo);
  font-size: 1.4rem;
  color: var(--gris4);
  width: 50px;
}
.rank-pos.top1 { color: var(--oro); text-shadow: 0 0 12px rgba(255,214,0,0.4); }
.rank-pos.top2 { color: #d4d4d4; }
.rank-pos.top3 { color: #cd7f32; }
.rank-nombre { font-weight: 700; color: var(--blanco); }
.rank-yo { color: var(--verde); }
.rank-pts {
  font-family: var(--titulo);
  font-size: 1.6rem;
  color: var(--verde);
  text-align: right;
}
.rank-5s, .rank-3s {
  font-family: var(--titulo);
  font-size: 1.1rem;
  text-align: center;
}
.rank-5s { color: var(--oro); }
.rank-3s { color: var(--verde); }

/* ===== MIS RESULTADOS ===== */
.resultados-grupo { margin-bottom: 32px; }
.resultado-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 16px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  transition: background 150ms var(--ease-out);
  border-radius: 6px;
}
@media (hover: hover) and (pointer: fine) {
  .resultado-row:hover { background: var(--gris2); }
}
.res-local { text-align: right; flex: 1; font-family: var(--cond); font-weight: 700; }
.res-marcadores { display: flex; align-items: center; gap: 8px; font-family: var(--titulo); font-size: 1.2rem; }
.res-real { color: var(--blanco); }
.res-pred { color: var(--gris4); font-size: 0.9rem; }
.res-sep { color: var(--gris4); }
.res-visitante { flex: 1; font-family: var(--cond); font-weight: 700; }
.res-pts { width: 40px; text-align: center; }

/* ===== SPINNER ===== */
.spinner {
  width: 36px; height: 36px;
  border: 2px solid var(--gris3);
  border-top-color: var(--verde);
  border-radius: 50%;
  animation: spin .6s linear infinite;
  margin: 60px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== TOAST ===== */
#toast {
  position: fixed;
  bottom: 24px; right: 24px;
  background: rgba(17, 20, 17, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(0,200,83,0.4);
  border-radius: 10px;
  padding: 12px 22px;
  font-family: var(--cond);
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--verde);
  z-index: 999;
  transform: translateY(80px);
  opacity: 0;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4), 0 0 20px rgba(0,200,83,0.08);
  transition: transform 320ms var(--ease-out), opacity 280ms ease-out;
}
#toast.show { transform: translateY(0); opacity: 1; }

/* ===== RESPONSIVE ===== */
@media (max-width: 600px) {
  .header-inner { padding: 10px 16px; }
  .logo h1 { font-size: 1.6rem; }
  main { padding: 20px 12px; }
  .partidos-grid { grid-template-columns: 1fr; }
  .equipo-nombre { font-size: 0.82rem; }
  nav.tabs li a { padding: 12px 10px; font-size: 0.78rem; }

<script>
// ---- Datos del mundial ----
const GRUPOS = {
  A: ["México","Corea del Sur","Sudáfrica","Rep. Checa"],
  B: ["Canadá","Suiza","Qatar","Bosnia y Herzegovina"],
  C: ["Brasil","Marruecos","Escocia","Haití"],
  D: ["EE.UU.","Paraguay","Australia","Turquía"],
  E: ["Alemania","Ecuador","Costa de Marfil","Curazao"],
  F: ["Países Bajos","Japón","Túnez","Ucrania"],
  G: ["Bélgica","Irán","Egipto","Nueva Zelanda"],
  H: ["España","Uruguay","Arabia Saudí","Cabo Verde"],
  I: ["Francia","Senegal","Noruega","Irak"],
  J: ["Argentina","Austria","Argelia","Jordania"],
  K: ["Portugal","Colombia","Uzbekistán","RD Congo"],
  L: ["Inglaterra","Croacia","Panamá","Ghana"]
};

const BANDERAS = {
  "México":"🇲🇽","Corea del Sur":"🇰🇷","Sudáfrica":"🇿🇦","Rep. Checa":"🇨🇿",
  "Canadá":"🇨🇦","Suiza":"🇨🇭","Qatar":"🇶🇦","Bosnia y Herzegovina":"🇧🇦",
  "Brasil":"🇧🇷","Marruecos":"🇲🇦","Escocia":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Haití":"🇭🇹",
  "EE.UU.":"🇺🇸","Paraguay":"🇵🇾","Australia":"🇦🇺","Turquía":"🇹🇷",
  "Alemania":"🇩🇪","Ecuador":"🇪🇨","Costa de Marfil":"🇨🇮","Curazao":"🇨🇼",
  "Países Bajos":"🇳🇱","Japón":"🇯🇵","Túnez":"🇹🇳","Ucrania":"🇺🇦",
  "Bélgica":"🇧🇪","Irán":"🇮🇷","Egipto":"🇪🇬","Nueva Zelanda":"🇳🇿",
  "España":"🇪🇸","Uruguay":"🇺🇾","Arabia Saudí":"🇸🇦","Cabo Verde":"🇨🇻",
  "Francia":"🇫🇷","Senegal":"🇸🇳","Noruega":"🇳🇴","Irak":"🇮🇶",
  "Argentina":"🇦🇷","Austria":"🇦🇹","Argelia":"🇩🇿","Jordania":"🇯🇴",
  "Portugal":"🇵🇹","Colombia":"🇨🇴","Uzbekistán":"🇺🇿","RD Congo":"🇨🇩",
  "Inglaterra":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Croacia":"🇭🇷","Panamá":"🇵🇦","Ghana":"🇬🇭"
};

function generarFixture() {
  const fixture = [];
  let num = 1;
  for (const [grupo, equipos] of Object.entries(GRUPOS)) {
    const pares = [[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]];
    const fechas = [1,1,2,2,3,3];
    pares.forEach(([i,j], idx) => {
      fixture.push({
        id: `${grupo}${idx+1}`,
        num: num++,
        grupo,
        fecha: fechas[idx],
        local: equipos[i],
        visitante: equipos[j]
      });
    });
  }
  return fixture;
}

const FIXTURE = generarFixture();

function calcularPuntos(pred, real) {
  if (!real || real.gl === null || real.gv === null) return null;
  if (pred === null || pred.gl === null || pred.gv === null) return 0;
  if (pred.gl === real.gl && pred.gv === real.gv) return 5;
  const signo = v => v > 0 ? 1 : v < 0 ? -1 : 0;
  if (signo(pred.gl - pred.gv) === signo(real.gl - real.gv)) return 3;
  return 0;
}
</script>

<script type="module">
// El módulo Firebase ya se inicializó arriba como window._db
// Esperamos que esté listo

let currentUser = null;
let prediccionesCache = {};
let resultadosCache = {};
let rankingUnsub = null;
let predAbiertoCache = true; // se actualiza desde Firebase

// ---- Utilidades ----
function estaAbierto() {
  return predAbiertoCache;
}

function toast(msg, dur = 2500) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), dur);
}

function setTab(name) {
  document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.remove("active"));
  document.getElementById(`tab-${name}`).classList.add("active");
  document.querySelector(`[data-tab="${name}"]`).classList.add("active");

  if (name === "predicciones") renderPredicciones();
  if (name === "resultados") renderResultados();
  if (name === "ranking") renderRanking();
}

// ---- AUTH ----
async function login(usuario, pass) {
  const db = window._db;
  const { doc, getDoc } = window._firebase;
  const err = document.getElementById("login-error");
  err.textContent = "";

  try {
    const snap = await getDoc(doc(db, "usuarios", usuario.toLowerCase().trim()));
    if (!snap.exists()) { err.textContent = "Usuario no encontrado."; return; }
    const data = snap.data();
    if (String(data.pin) !== String(pass.trim())) { err.textContent = "Código incorrecto."; return; }

    currentUser = { id: usuario.toLowerCase().trim(), nombre: data.nombre || usuario, admin: data.admin || false };
    localStorage.setItem("prode_user", JSON.stringify(currentUser));

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("chip-usuario").textContent = currentUser.nombre;

    await cargarDatos();
    setTab("predicciones");
  } catch(e) {
    err.textContent = "Error de conexión. Intente nuevamente.";
    console.error(e);
  }
}

async function cargarDatos() {
  const db = window._db;
  const { doc, getDoc, collection, getDocs } = window._firebase;

  // Predicciones del usuario
  const pSnap = await getDoc(doc(db, "predicciones", currentUser.id));
  prediccionesCache = pSnap.exists() ? pSnap.data() : {};

  // Resultados reales
  const rSnap = await getDoc(doc(db, "resultados", "oficial"));
  resultadosCache = rSnap.exists() ? rSnap.data() : {};

  // Estado de predicciones (controlado desde admin)
  const cfgSnap = await getDoc(doc(db, "config", "predicciones"));
  predAbiertoCache = cfgSnap.exists() ? cfgSnap.data().abierto : true;
}

// ---- PREDICCIONES ----
function renderPredicciones() {
  const cont = document.getElementById("predicciones-content");
  const abierto = estaAbierto();
  let html = "";

  if (!abierto) {
    html += `<div class="banner-cerrado">
      <span class="icon">🔒</span>
      <div>
        <strong>Predicciones cerradas</strong>
        <span>El Mundial comenzó. Podés ver tus predicciones y el ranking.</span>
      </div>
    </div>`;
  }

  // Agrupar por grupo
  const grupos = {};
  FIXTURE.forEach(p => {
    if (!grupos[p.grupo]) grupos[p.grupo] = [];
    grupos[p.grupo].push(p);
  });

  for (const [letra, partidos] of Object.entries(grupos)) {
    const equipos = GRUPOS[letra];
    html += `<div class="grupo-section">
      <div class="grupo-header">
        <span class="grupo-label">GRUPO ${letra}</span>
        <span class="grupo-equipos">${equipos.map(e => `${BANDERAS[e]||''} ${e}`).join(" · ")}</span>
      </div>
      <div class="partidos-grid">`;

    partidos.forEach(p => {
      const pred = prediccionesCache[p.id] || null;
      const real = resultadosCache[p.id] || null;
      const pts = calcularPuntos(pred, real);
      const completado = pred && pred.gl !== null && pred.gv !== null;

      let ptsBadge = "";
      if (pts === 5) ptsBadge = `<div class="punto-badge punto-5">5</div>`;
      else if (pts === 3) ptsBadge = `<div class="punto-badge punto-3">3</div>`;
      else if (pts === 0 && real) ptsBadge = `<div class="punto-badge punto-0">0</div>`;
      else ptsBadge = `<div class="punto-badge punto-pendiente"></div>`;

      const glVal = (completado && pred.gl !== undefined) ? pred.gl : "";
      const gvVal = (completado && pred.gv !== undefined) ? pred.gv : "";
      const readonly = !abierto ? "readonly" : "";
      const cardClass = completado ? "completado" : "";

      html += `<div class="partido-card ${cardClass}" data-id="${p.id}">
        ${ptsBadge}
        <span class="equipo-nombre">${BANDERAS[p.local]||''} ${p.local}</span>
        <div class="marcador-input">
          <input type="number" class="gol-input" min="0" max="20"
            data-pid="${p.id}" data-lado="gl" value="${glVal}" ${readonly}
            placeholder="–">
          <span class="gol-sep">:</span>
          <input type="number" class="gol-input" min="0" max="20"
            data-pid="${p.id}" data-lado="gv" value="${gvVal}" ${readonly}
            placeholder="–">
        </div>
        <span class="equipo-nombre visitante">${BANDERAS[p.visitante]||''} ${p.visitante}</span>
        <span class="fecha-badge">F${p.fecha}</span>
      </div>`;
    });

    html += `</div></div>`;
  }

  if (abierto) {
    html += `<button class="btn-guardar" id="btn-guardar-pred">GUARDAR PREDICCIONES</button>
             <div class="save-status" id="save-status"></div>`;
  }

  cont.innerHTML = html;

  if (abierto) {
    // Auto-guardar al cambiar inputs
    cont.querySelectorAll(".gol-input").forEach(inp => {
      inp.addEventListener("input", () => {
        const pid = inp.dataset.pid;
        const lado = inp.dataset.lado;
        const val = inp.value === "" ? null : parseInt(inp.value);
        if (!prediccionesCache[pid]) prediccionesCache[pid] = { gl: null, gv: null };
        prediccionesCache[pid][lado] = val;

        // Marcar como completado si ambos tienen valor
        const card = inp.closest(".partido-card");
        const pred = prediccionesCache[pid];
        if (pred.gl !== null && pred.gv !== null) card.classList.add("completado");
        else card.classList.remove("completado");
      });
    });

    document.getElementById("btn-guardar-pred").addEventListener("click", guardarPredicciones);
  }
}

async function guardarPredicciones() {
  const btn = document.getElementById("btn-guardar-pred");
  const status = document.getElementById("save-status");
  btn.disabled = true;
  btn.textContent = "GUARDANDO...";
  status.textContent = "";

  const db = window._db;
  const { doc, setDoc } = window._firebase;

  try {
    await setDoc(doc(db, "predicciones", currentUser.id), prediccionesCache);
    status.textContent = "✓ Predicciones guardadas correctamente";
    toast("✓ Guardado");
  } catch(e) {
    status.style.color = "var(--rojo)";
    status.textContent = "✗ Error al guardar. Intentá de nuevo.";
    console.error(e);
  } finally {
    btn.disabled = false;
    btn.textContent = "GUARDAR PREDICCIONES";
  }
}

// ---- RESULTADOS ----
function renderResultados() {
  const cont = document.getElementById("resultados-content");
  let totalPts = 0, total5 = 0, total3 = 0, pendientes = 0;
  let html = "";

  const grupos = {};
  FIXTURE.forEach(p => {
    if (!grupos[p.grupo]) grupos[p.grupo] = [];
    grupos[p.grupo].push(p);
  });

  for (const [letra, partidos] of Object.entries(grupos)) {
    let grupoHtml = "";
    partidos.forEach(p => {
      const pred = prediccionesCache[p.id] || null;
      const real = resultadosCache[p.id] || null;
      const pts = calcularPuntos(pred, real);

      if (pts !== null) {
        totalPts += pts;
        if (pts === 5) total5++;
        if (pts === 3) total3++;
      } else { pendientes++; }

      const predTxt = pred && pred.gl !== null ? `${pred.gl}-${pred.gv}` : "–";
      const realTxt = real && real.gl !== null ? `${real.gl}-${real.gv}` : "?";
      let ptsBadge = "";
      if (pts === 5) ptsBadge = `<div class="punto-badge punto-5">5</div>`;
      else if (pts === 3) ptsBadge = `<div class="punto-badge punto-3">3</div>`;
      else if (pts === 0 && real) ptsBadge = `<div class="punto-badge punto-0">0</div>`;
      else ptsBadge = `<div class="punto-badge punto-pendiente" title="Sin resultado aún"></div>`;

      grupoHtml += `<div class="resultado-row">
        ${ptsBadge}
        <span class="res-local">${BANDERAS[p.local]||''} ${p.local}</span>
        <div class="res-marcadores">
          <span class="res-real">${realTxt}</span>
          <span class="res-sep">·</span>
          <span class="res-pred">${predTxt}</span>
        </div>
        <span class="res-visitante">${BANDERAS[p.visitante]||''} ${p.visitante}</span>
      </div>`;
    });

    html += `<div class="resultados-grupo">
      <div class="grupo-header">
        <span class="grupo-label">GRUPO ${letra}</span>
      </div>
      ${grupoHtml}
    </div>`;
  }

  const resumen = `<div style="background:var(--gris1);border:1px solid var(--gris3);border-radius:10px;
    padding:20px 24px;margin-bottom:32px;display:flex;gap:32px;flex-wrap:wrap;align-items:center;">
    <div><div style="font-family:var(--titulo);font-size:3rem;color:var(--verde);line-height:1">${totalPts}</div>
      <div style="font-family:var(--cond);font-size:0.75rem;letter-spacing:2px;color:var(--gris4);text-transform:uppercase">Puntos totales</div></div>
    <div><div style="font-family:var(--titulo);font-size:2rem;color:var(--oro)">${total5}</div>
      <div style="font-family:var(--cond);font-size:0.75rem;letter-spacing:2px;color:var(--gris4);text-transform:uppercase">Exactos (5pts)</div></div>
    <div><div style="font-family:var(--titulo);font-size:2rem;color:var(--verde)">${total3}</div>
      <div style="font-family:var(--cond);font-size:0.75rem;letter-spacing:2px;color:var(--gris4);text-transform:uppercase">Resultado (3pts)</div></div>
    <div><div style="font-family:var(--titulo);font-size:2rem;color:var(--gris4)">${pendientes}</div>
      <div style="font-family:var(--cond);font-size:0.75rem;letter-spacing:2px;color:var(--gris4);text-transform:uppercase">Pendientes</div></div>
  </div>`;

  cont.innerHTML = resumen + html;
}

// ---- RANKING ----
async function renderRanking() {
  const cont = document.getElementById("ranking-content");
  cont.innerHTML = `<div class="spinner"></div>`;
  const db = window._db;
  const { collection, getDocs } = window._firebase;

  try {
    // Cargar todas las predicciones
    const predsSnap = await getDocs(collection(db, "predicciones"));
    const usersSnap = await getDocs(collection(db, "usuarios"));

    const usuarios = {};
    usersSnap.forEach(d => {
      const dat = d.data();
      if (dat.activo !== false) usuarios[d.id] = dat.nombre || d.id;
    });

    const ranking = [];
    predsSnap.forEach(d => {
      const uid = d.id;
      if (!usuarios[uid]) return; // solo usuarios activos
      const preds = d.data();
      let pts = 0, e5 = 0, e3 = 0;
      FIXTURE.forEach(p => {
        const pred = preds[p.id] || null;
        const real = resultadosCache[p.id] || null;
        const p_ = calcularPuntos(pred, real);
        if (p_ !== null) { pts += p_; if (p_===5) e5++; if (p_===3) e3++; }
      });
      ranking.push({ uid, nombre: usuarios[uid], pts, e5, e3 });
    });

    ranking.sort((a,b) => b.pts - a.pts || b.e5 - a.e5 || b.e3 - a.e3);

    let html = `<div style="font-family:var(--cond);font-size:0.75rem;letter-spacing:2px;
      color:var(--gris4);text-transform:uppercase;margin-bottom:16px;">
      ${ranking.length} participantes · Actualizado en tiempo real
    </div>
    <table class="ranking-table">
      <thead><tr>
        <th>#</th><th>Jugador</th>
        <th style="text-align:center">🥇</th>
        <th style="text-align:center">✅</th>
        <th style="text-align:right">Puntos</th>
      </tr></thead><tbody>`;

    ranking.forEach((r, idx) => {
      const pos = idx + 1;
      const posClass = pos===1?"top1":pos===2?"top2":pos===3?"top3":"";
      const esYo = r.uid === currentUser.id ? "rank-yo" : "";
      html += `<tr>
        <td class="rank-pos ${posClass}">${pos}</td>
        <td class="rank-nombre ${esYo}">${r.nombre}${r.uid===currentUser.id?' ◀':''}</td>
        <td class="rank-5s">${r.e5 || '–'}</td>
        <td class="rank-3s">${r.e3 || '–'}</td>
        <td class="rank-pts">${r.pts}</td>
      </tr>`;
    });

    html += `</tbody></table>`;
    cont.innerHTML = html;
  } catch(e) {
    cont.innerHTML = `<p style="color:var(--rojo);font-family:var(--cond)">Error cargando ranking.</p>`;
    console.error(e);
  }
}

// ---- INIT ----
document.addEventListener("DOMContentLoaded", () => {
  // Tabs
  document.querySelectorAll("nav.tabs a").forEach(a => {
    a.addEventListener("click", e => {
      e.preventDefault();
      setTab(a.dataset.tab);
    });
  });

  // Logout
  document.getElementById("btn-logout").addEventListener("click", () => {
    currentUser = null;
    localStorage.removeItem("prode_user");
    location.reload();
  });

  // Enter en login
  ["inp-usuario","inp-pass"].forEach(id => {
    document.getElementById(id).addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });
  });

  document.getElementById("btn-ingresar").addEventListener("click", doLogin);

  function doLogin() {
    const u = document.getElementById("inp-usuario").value;
    const p = document.getElementById("inp-pass").value;
    if (!u || !p) {
      document.getElementById("login-error").textContent = "Completá usuario y código.";
      return;
    }
    login(u, p);
  }

  // Auto-login si hay sesión guardada
  const saved = localStorage.getItem("prode_user");
  if (saved) {
    try {
      const u = JSON.parse(saved);
      // Esperamos Firebase
      const tryAutoLogin = () => {
        if (!window._fbReady) { setTimeout(tryAutoLogin, 100); return; }
        currentUser = u;
        document.getElementById("login-screen").style.display = "none";
        document.getElementById("app").style.display = "block";
        document.getElementById("chip-usuario").textContent = u.nombre;
        cargarDatos().then(() => setTab("predicciones"));
      };
      tryAutoLogin();
    } catch(e) { localStorage.removeItem("prode_user"); }
  }
});
</script>
