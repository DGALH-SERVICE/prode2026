<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Prode Mundial 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, setDoc, getDoc, collection, getDocs, deleteDoc }
    from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ⚠ MISMO CONFIG QUE index.html
  const firebaseConfig = {
    apiKey: "AIzaSyAMDteMBM57J9tBYBo-97gbtaC0jFnGOdo",
    authDomain: "prode-mundial-2026-853a5.firebaseapp.com",
    projectId: "prode-mundial-2026-853a5",
    storageBucket: "prode-mundial-2026-853a5.firebasestorage.app",
    messagingSenderId: "311642186090",
    appId: "1:311642186090:web:d3bc1756ba862c45f7c513"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window._db = db;
  window._fb = { doc, setDoc, getDoc, collection, getDocs, deleteDoc };
  window._fbReady = true;
  document.dispatchEvent(new Event("firebase-ready"));
</script>

<style>
:root {
  --negro:#0a0a0a;--verde:#00c853;--oro:#ffd600;--rojo:#f44336;
  --gris1:#1a1a1a;--gris2:#252525;--gris3:#333;--gris4:#666;
  --blanco:#f0f0f0;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--negro);color:var(--blanco);font-family:'Barlow',sans-serif;padding:24px;}
h1{font-family:'Bebas Neue',cursive;font-size:2.5rem;color:var(--verde);letter-spacing:3px;margin-bottom:4px;}
.sub{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;letter-spacing:3px;color:var(--gris4);
  text-transform:uppercase;margin-bottom:32px;}

/* Login admin */
#admin-login{max-width:360px;margin:60px auto;}
.card{background:var(--gris1);border:1px solid var(--gris3);border-radius:10px;padding:32px;}
.card h2{font-family:'Bebas Neue',cursive;font-size:1.8rem;color:var(--verde);margin-bottom:20px;}
input[type=text],input[type=password],input[type=number]{
  width:100%;background:var(--gris2);border:1px solid var(--gris3);border-radius:6px;
  padding:10px 14px;color:var(--blanco);font-family:'Barlow',sans-serif;font-size:0.95rem;
  margin-bottom:10px;outline:none;}
input:focus{border-color:var(--verde);}
.btn{background:var(--verde);color:var(--negro);border:none;border-radius:6px;
  padding:10px 20px;font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:1px;
  cursor:pointer;transition:background .2s;}
.btn:hover{background:#00e676;}
.btn.danger{background:var(--rojo);color:#fff;}
.btn.secondary{background:var(--gris3);color:var(--blanco);}
.btn:disabled{background:var(--gris3);color:var(--gris4);cursor:not-allowed;}
.err{color:var(--rojo);font-size:0.85rem;margin-top:8px;font-family:'Barlow Condensed',sans-serif;}

/* Main admin */
#admin-app{display:none;}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--gris3);margin-bottom:32px;}
.tab-btn{background:none;border:none;border-bottom:3px solid transparent;padding:12px 20px;
  font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:0.9rem;letter-spacing:1px;
  text-transform:uppercase;color:var(--gris4);cursor:pointer;transition:all .2s;}
.tab-btn.active{color:var(--verde);border-bottom-color:var(--verde);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}

/* Tabla resultados */
.res-grid{display:grid;gap:8px;}
.res-row{background:var(--gris1);border:1px solid var(--gris3);border-radius:8px;
  padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.res-equipos{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:0.95rem;display:flex;align-items:center;gap:8px;}
.res-inputs{display:flex;align-items:center;gap:6px;}
.g-inp{width:50px;height:40px;background:var(--gris2);border:1px solid var(--gris3);
  border-radius:6px;color:var(--blanco);font-family:'Bebas Neue',cursive;font-size:1.3rem;
  text-align:center;outline:none;-moz-appearance:textfield;}
.g-inp::-webkit-outer-spin-button,.g-inp::-webkit-inner-spin-button{-webkit-appearance:none;}
.g-inp:focus{border-color:var(--verde);}
.g-inp.ok{border-color:var(--verde);background:#0a1f0a;}
.grupo-title{font-family:'Bebas Neue',cursive;font-size:1.5rem;color:var(--verde);
  margin:24px 0 8px;letter-spacing:2px;}
.save-all-bar{position:sticky;bottom:0;background:var(--negro);border-top:1px solid var(--gris3);
  padding:16px 0;text-align:center;margin-top:32px;}

/* Tabla usuarios */
.users-table{width:100%;border-collapse:collapse;margin-top:16px;}
.users-table th{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;letter-spacing:2px;
  text-transform:uppercase;color:var(--gris4);padding:10px 12px;text-align:left;
  border-bottom:1px solid var(--gris3);}
.users-table td{padding:10px 12px;border-bottom:1px solid var(--gris2);
  font-family:'Barlow Condensed',sans-serif;font-size:0.95rem;}
.badge-activo{background:#0a2a0a;color:var(--verde);border-radius:4px;padding:2px 8px;font-size:0.75rem;}
.badge-inactivo{background:#2a0a0a;color:var(--rojo);border-radius:4px;padding:2px 8px;font-size:0.75rem;}
.inline-form{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:20px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;letter-spacing:1px;
  text-transform:uppercase;color:var(--gris4);}
.field input{margin-bottom:0;}

#toast{position:fixed;bottom:20px;right:20px;background:var(--gris1);border:1px solid var(--verde);
  border-radius:8px;padding:12px 20px;font-family:'Barlow Condensed',sans-serif;font-weight:600;
  color:var(--verde);z-index:999;transform:translateY(60px);opacity:0;transition:all .3s;}
#toast.show{transform:translateY(0);opacity:1;}
</style>
</head>
<body>

<!-- ADMIN LOGIN -->
<div id="admin-login">
  <div class="card">
    <h2>⚙ Admin — Prode 2026</h2>
    <input type="text" id="a-user" placeholder="Usuario admin">
    <input type="password" id="a-pass" placeholder="Contraseña">
    <button class="btn" id="btn-admin-login">INGRESAR</button>
    <div class="err" id="a-err"></div>
  </div>
</div>

<!-- ADMIN APP -->
<div id="admin-app">
  <h1>PRODE 2026</h1>
  <div class="sub">Panel de Administración</div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="resultados">Cargar Resultados</button>
    <button class="tab-btn" data-tab="usuarios">Usuarios</button>
  </div>

  <!-- TAB: RESULTADOS -->
  <div class="tab-panel active" id="panel-resultados">
    <p style="font-family:'Barlow Condensed',sans-serif;color:var(--gris4);margin-bottom:20px;font-size:0.9rem;">
      Ingresá los resultados reales de cada partido. Al guardar, se recalcula el ranking automáticamente.
    </p>
    <div id="res-grid-cont"><div style="color:var(--gris4)">Cargando...</div></div>
    <div class="save-all-bar">
      <button class="btn" id="btn-guardar-res">GUARDAR TODOS LOS RESULTADOS</button>
      <div id="res-status" style="font-family:'Barlow Condensed',sans-serif;color:var(--verde);
        font-size:0.85rem;margin-top:8px;"></div>
    </div>
  </div>

  <!-- TAB: USUARIOS -->
  <div class="tab-panel" id="panel-usuarios">
    <h3 style="font-family:'Bebas Neue',cursive;font-size:1.5rem;margin-bottom:16px;color:var(--verde)">
      AGREGAR USUARIO
    </h3>
    <div class="inline-form">
      <div class="field">
        <label>CUIL / Usuario</label>
        <input type="text" id="new-uid" placeholder="20-12345678-9">
      </div>
      <div class="field">
        <label>Nombre</label>
        <input type="text" id="new-nombre" placeholder="Juan Pérez">
      </div>
      <div class="field">
        <label>PIN numérico</label>
        <input type="number" id="new-pin" placeholder="1234">
      </div>
      <div class="field" style="justify-content:flex-end">
        <button class="btn" id="btn-add-user">AGREGAR</button>
      </div>
    </div>
    <div id="add-user-err" class="err" style="margin-bottom:12px;"></div>
    <h3 style="font-family:'Bebas Neue',cursive;font-size:1.5rem;margin-bottom:12px;color:var(--verde)">
      USUARIOS REGISTRADOS
    </h3>
    <div id="users-list"><div style="color:var(--gris4)">Cargando...</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
// Fixture (mismo que index.html)
const GRUPOS = {
  A:["México","Corea del Sur","Sudáfrica","Rep. Checa"],
  B:["Canadá","Suiza","Qatar","Bosnia y Herzegovina"],
  C:["Brasil","Marruecos","Escocia","Haití"],
  D:["EE.UU.","Paraguay","Australia","Turquía"],
  E:["Alemania","Ecuador","Costa de Marfil","Curazao"],
  F:["Países Bajos","Japón","Túnez","Ucrania"],
  G:["Bélgica","Irán","Egipto","Nueva Zelanda"],
  H:["España","Uruguay","Arabia Saudí","Cabo Verde"],
  I:["Francia","Senegal","Noruega","Irak"],
  J:["Argentina","Austria","Argelia","Jordania"],
  K:["Portugal","Colombia","Uzbekistán","RD Congo"],
  L:["Inglaterra","Croacia","Panamá","Ghana"]
};
const BANDERAS={"México":"🇲🇽","Corea del Sur":"🇰🇷","Sudáfrica":"🇿🇦","Rep. Checa":"🇨🇿","Canadá":"🇨🇦","Suiza":"🇨🇭","Qatar":"🇶🇦","Bosnia y Herzegovina":"🇧🇦","Brasil":"🇧🇷","Marruecos":"🇲🇦","Escocia":"🏴󠁧󠁢󠁳󠁣󠁴󠁿","Haití":"🇭🇹","EE.UU.":"🇺🇸","Paraguay":"🇵🇾","Australia":"🇦🇺","Turquía":"🇹🇷","Alemania":"🇩🇪","Ecuador":"🇪🇨","Costa de Marfil":"🇨🇮","Curazao":"🇨🇼","Países Bajos":"🇳🇱","Japón":"🇯🇵","Túnez":"🇹🇳","Ucrania":"🇺🇦","Bélgica":"🇧🇪","Irán":"🇮🇷","Egipto":"🇪🇬","Nueva Zelanda":"🇳🇿","España":"🇪🇸","Uruguay":"🇺🇾","Arabia Saudí":"🇸🇦","Cabo Verde":"🇨🇻","Francia":"🇫🇷","Senegal":"🇸🇳","Noruega":"🇳🇴","Irak":"🇮🇶","Argentina":"🇦🇷","Austria":"🇦🇹","Argelia":"🇩🇿","Jordania":"🇯🇴","Portugal":"🇵🇹","Colombia":"🇨🇴","Uzbekistán":"🇺🇿","RD Congo":"🇨🇩","Inglaterra":"🏴󠁧󠁢󠁥󠁮󠁧󠁿","Croacia":"🇭🇷","Panamá":"🇵🇦","Ghana":"🇬🇭"};

function genFixture(){
  const f=[];
  for(const[g,eq]of Object.entries(GRUPOS)){
    const p=[[0,1],[2,3],[0,2],[1,3],[0,3],[1,2]],fe=[1,1,2,2,3,3];
    p.forEach(([i,j],idx)=>f.push({id:`${g}${idx+1}`,grupo:g,fecha:fe[idx],local:eq[i],visitante:eq[j]}));
  }
  return f;
}
const FIXTURE=genFixture();
</script>

<script type="module">
// Admin logic
const ADMIN_USER = "admin";  // ← cambiá por tu usuario admin
const ADMIN_PASS = "admin2026"; // ← cambiá por tu contraseña

let resultadosCache = {};

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2500);
}

// ---- Login ----
const waitFB = (fn) => {
  if(window._fbReady) fn();
  else document.addEventListener("firebase-ready", fn, {once:true});
};

document.getElementById("btn-admin-login").addEventListener("click", () => {
  const u = document.getElementById("a-user").value.trim();
  const p = document.getElementById("a-pass").value.trim();
  if(u===ADMIN_USER && p===ADMIN_PASS){
    document.getElementById("admin-login").style.display="none";
    document.getElementById("admin-app").style.display="block";
    waitFB(iniciarAdmin);
  } else {
    document.getElementById("a-err").textContent="Credenciales incorrectas.";
  }
});
["a-user","a-pass"].forEach(id=>{
  document.getElementById(id).addEventListener("keydown",e=>{
    if(e.key==="Enter") document.getElementById("btn-admin-login").click();
  });
});

async function iniciarAdmin(){
  await cargarResultados();
  renderGridResultados();
  await cargarUsuarios();

  document.getElementById("btn-guardar-res").addEventListener("click", guardarResultados);
}

async function cargarResultados(){
  const{doc,getDoc}=window._fb;
  const snap=await getDoc(doc(window._db,"resultados","oficial"));
  resultadosCache=snap.exists()?snap.data():{};
}

function renderGridResultados(){
  const cont=document.getElementById("res-grid-cont");
  let html="";
  const grupos={};
  FIXTURE.forEach(p=>{if(!grupos[p.grupo])grupos[p.grupo]=[];grupos[p.grupo].push(p);});

  for(const[letra,partidos]of Object.entries(grupos)){
    html+=`<div class="grupo-title">GRUPO ${letra}</div><div class="res-grid">`;
    partidos.forEach(p=>{
      const r=resultadosCache[p.id]||{gl:null,gv:null};
      const glv=r.gl!==null?r.gl:"";
      const gvv=r.gv!==null?r.gv:"";
      const ok=r.gl!==null?"ok":"";
      html+=`<div class="res-row">
        <div class="res-equipos">
          <span>${BANDERAS[p.local]||''} ${p.local}</span>
          <span style="color:var(--gris4)">vs</span>
          <span>${BANDERAS[p.visitante]||''} ${p.visitante}</span>
        </div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.75rem;
          color:var(--gris4);margin-right:4px;">F${p.fecha}</div>
        <div class="res-inputs">
          <input type="number" class="g-inp ${ok}" min="0" max="20"
            data-pid="${p.id}" data-lado="gl" value="${glv}" placeholder="–">
          <span style="font-family:'Bebas Neue',cursive;color:var(--gris4);font-size:1.2rem">:</span>
          <input type="number" class="g-inp ${ok}" min="0" max="20"
            data-pid="${p.id}" data-lado="gv" value="${gvv}" placeholder="–">
        </div>
      </div>`;
    });
    html+="</div>";
  }
  cont.innerHTML=html;

  cont.querySelectorAll(".g-inp").forEach(inp=>{
    inp.addEventListener("input",()=>{
      const pid=inp.dataset.pid, lado=inp.dataset.lado;
      const val=inp.value===""?null:parseInt(inp.value);
      if(!resultadosCache[pid]) resultadosCache[pid]={gl:null,gv:null};
      resultadosCache[pid][lado]=val;
      const row=inp.closest(".res-row");
      const r=resultadosCache[pid];
      row.querySelectorAll(".g-inp").forEach(i=>{
        i.classList.toggle("ok",r.gl!==null&&r.gv!==null);
      });
    });
  });
}

async function guardarResultados(){
  const btn=document.getElementById("btn-guardar-res");
  const status=document.getElementById("res-status");
  btn.disabled=true; btn.textContent="GUARDANDO...";
  const{doc,setDoc}=window._fb;
  try{
    await setDoc(doc(window._db,"resultados","oficial"),resultadosCache);
    status.textContent=`✓ Guardado — ${Object.keys(resultadosCache).filter(k=>resultadosCache[k].gl!==null).length} partidos con resultado`;
    toast("✓ Resultados guardados");
  }catch(e){
    status.style.color="var(--rojo)";
    status.textContent="✗ Error al guardar.";
  }finally{
    btn.disabled=false; btn.textContent="GUARDAR TODOS LOS RESULTADOS";
  }
}

// ---- USUARIOS ----
async function cargarUsuarios(){
  const{collection,getDocs}=window._fb;
  const snap=await getDocs(collection(window._db,"usuarios"));
  const cont=document.getElementById("users-list");
  const users=[];
  snap.forEach(d=>users.push({id:d.id,...d.data()}));
  users.sort((a,b)=>(a.nombre||a.id).localeCompare(b.nombre||b.id));

  let html=`<table class="users-table">
    <thead><tr><th>Usuario</th><th>Nombre</th><th>PIN</th><th>Estado</th><th></th></tr></thead><tbody>`;
  users.forEach(u=>{
    const activo=u.activo!==false;
    html+=`<tr>
      <td style="color:var(--gris4)">${u.id}</td>
      <td>${u.nombre||'–'}</td>
      <td style="font-family:'Bebas Neue',cursive;font-size:1.1rem">${u.pin||'–'}</td>
      <td><span class="${activo?'badge-activo':'badge-inactivo'}">${activo?'Activo':'Inactivo'}</span></td>
      <td>
        <button class="btn secondary" style="padding:4px 10px;font-size:0.8rem"
          onclick="toggleUser('${u.id}',${!activo})">${activo?'Desactivar':'Activar'}</button>
      </td>
    </tr>`;
  });
  html+=`</tbody></table><div style="font-family:'Barlow Condensed',sans-serif;font-size:0.8rem;
    color:var(--gris4);margin-top:12px">${users.length} usuarios registrados</div>`;
  cont.innerHTML=html;
}

document.getElementById("btn-add-user").addEventListener("click", async()=>{
  const uid=document.getElementById("new-uid").value.trim().toLowerCase().replace(/\s/g,"");
  const nombre=document.getElementById("new-nombre").value.trim();
  const pin=document.getElementById("new-pin").value.trim();
  const err=document.getElementById("add-user-err");
  err.textContent="";

  if(!uid||!nombre||!pin){err.textContent="Completá todos los campos.";return;}
  if(isNaN(pin)){err.textContent="El PIN debe ser numérico.";return;}

  const{doc,setDoc}=window._fb;
  try{
    await setDoc(doc(window._db,"usuarios",uid),{nombre,pin:parseInt(pin),activo:true});
    toast(`✓ Usuario ${nombre} agregado`);
    document.getElementById("new-uid").value="";
    document.getElementById("new-nombre").value="";
    document.getElementById("new-pin").value="";
    await cargarUsuarios();
  }catch(e){
    err.textContent="Error al guardar usuario.";
    console.error(e);
  }
});

window.toggleUser=async(uid,activo)=>{
  const{doc,setDoc,getDoc}=window._fb;
  const snap=await getDoc(doc(window._db,"usuarios",uid));
  if(!snap.exists())return;
  await setDoc(doc(window._db,"usuarios",uid),{...snap.data(),activo});
  toast(`Usuario ${activo?'activado':'desactivado'}`);
  await cargarUsuarios();
};

// ---- TABS ----
document.querySelectorAll(".tab-btn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
    document.querySelectorAll(".tab-panel").forEach(p=>p.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add("active");
    if(btn.dataset.tab==="usuarios") cargarUsuarios();
  });
});
</script>
</body>
</html>
